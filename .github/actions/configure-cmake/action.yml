name: 'Configure CMake'
description: 'Configure CMake build for OBS Stabilizer'
inputs:
  platform:
    description: 'Platform type (ubuntu, windows, macos)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Configure CMake (Unix)
      if: inputs.platform != 'windows'
      shell: bash
      run: |
        mkdir -p build
        cd build
        cmake_args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo)
        if [ -n "${OpenCV_DIR:-}" ]; then
          cmake_args+=("-DOpenCV_DIR=${OpenCV_DIR}")
        fi
        cmake .. "${cmake_args[@]}"
        echo "CMake configuration completed for standalone build"

    - name: Configure CMake (Windows)
      if: inputs.platform == 'windows'
      shell: powershell
      run: |
        mkdir build
        cd build
        $vcpkgRoot = "$env:VCPKG_ROOT"
        $toolchainFile = "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake"
        cmake .. -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchainFile" -DVCPKG_TARGET_TRIPLET=x64-windows
        Write-Host "CMake configuration completed for standalone build"
