name: Memory Sanitizer

on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/test_memory_leaks.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/memory-sanitizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/test_memory_leaks.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/memory-sanitizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-sanitizer:
    name: AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ubuntu

      - name: Configure sanitizer build
        env:
          CC: gcc
          CXX: g++
        run: |
          mkdir -p tmp/builds/memory-sanitizer tmp/reports/memory-sanitizer
          cmake -S . -B tmp/builds/memory-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,leak -fno-omit-frame-pointer -O1 -g' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,leak -fno-omit-frame-pointer -O1 -g' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,leak' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,leak'

      - name: Build memory leak tests
        run: cmake --build tmp/builds/memory-sanitizer --target stabilizer_tests --parallel 2

      - name: Run memory leak tests under sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1:check_initialization_order=1
          LSAN_OPTIONS: exitcode=23:report_objects=1
        run: |
          set -o pipefail
          timeout 10m ./tmp/builds/memory-sanitizer/stabilizer_tests \
            --gtest_filter='MemoryLeakTest.*' \
            --gtest_color=yes \
            2>&1 | tee tmp/reports/memory-sanitizer/sanitizer.log

      - name: Upload sanitizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-sanitizer-log-${{ github.run_number }}
          path: tmp/reports/memory-sanitizer/sanitizer.log
          if-no-files-found: warn
          retention-days: 14
