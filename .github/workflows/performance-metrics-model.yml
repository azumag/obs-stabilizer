name: Performance Metrics Model

on:
  pull_request:
    paths:
      - 'src/core/performance_metrics.hpp'
      - 'tests/performance_metrics_model_test.cpp'
      - '.github/workflows/performance-metrics-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone metrics test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Isrc tests/performance_metrics_model_test.cpp \
            -o performance_metrics_model_test
      - name: Run metrics test
        run: ./performance_metrics_model_test
