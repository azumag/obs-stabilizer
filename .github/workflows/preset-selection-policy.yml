name: Preset Selection Policy

on:
  pull_request:
    paths:
      - 'src/ui/preset_selection.hpp'
      - 'tests/preset_selection_policy_test.cpp'
      - '.github/workflows/preset-selection-policy.yml'
  workflow_dispatch:

concurrency:
  group: preset-selection-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone policy test
        run: |
          mkdir -p tmp/tests
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/preset_selection_policy_test.cpp \
            -o tmp/tests/preset_selection_policy_test
      - name: Run standalone policy test
        run: tmp/tests/preset_selection_policy_test
