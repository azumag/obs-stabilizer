name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    # Safety net: without this, a hung step (e.g. a stalled apt mirror) is
    # only stopped by GitHub's 6-hour default job timeout, as happened on
    # 2026-08-12 (run 31630268765) when apt-get stalled fetching from
    # packages.microsoft.com and the run sat "in progress" for 6 hours
    # before being force-cancelled.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ubuntu

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y gcovr lcov googletest libgtest-dev && cd /usr/src/googletest && sudo cmake CMakeLists.txt && sudo make && sudo cp lib/*.a /usr/lib

      - name: Prepare temporary directories
        run: |
          rm -rf tmp/builds/coverage tmp/reports/coverage
          mkdir -p tmp/builds/coverage tmp/reports/coverage

      - name: Configure and build with coverage
        run: cd tmp/builds/coverage && cmake ../../.. -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage" && ninja

      - name: Run tests with coverage
        run: cd tmp/builds/coverage && if [ -f "stabilizer_tests" ]; then ./stabilizer_tests || echo "Tests completed with failures, continuing with coverage report generation"; else echo "Test executable not found, skipping test run" && ls -la; fi

      - name: Generate coverage report
        run: gcovr --root . --html --html-details -o tmp/reports/coverage/coverage-report.html || echo "gcovr HTML generation failed, continuing" && gcovr --root . --xml -o tmp/reports/coverage/coverage.xml || echo "gcovr XML generation failed, continuing" && lcov --capture --directory . --output-file tmp/reports/coverage/coverage.info --ignore-errors mismatch --ignore-errors empty || echo "lcov capture failed, continuing" && lcov --remove tmp/reports/coverage/coverage.info '/usr/*' --output-file tmp/reports/coverage/coverage.info --ignore-errors empty || echo "lcov filtering failed, continuing"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_number }}
          retention-days: 14
          path: tmp/reports/coverage/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ubuntu

      - name: Install static analysis tools
        run: echo "cppcheck already installed by setup-build-env action"

      - name: Prepare temporary directories
        run: |
          rm -rf tmp/reports/static-analysis
          mkdir -p tmp/reports/static-analysis

      - name: Run static analysis
        run: cppcheck --enable=all --xml --xml-version=2 --output-file=tmp/reports/static-analysis/cppcheck.xml src/ && cppcheck --enable=all --template=gcc src/ > tmp/reports/static-analysis/cppcheck.txt 2>&1 || true

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports-${{ github.run_number }}
          retention-days: 14
          path: tmp/reports/static-analysis/
