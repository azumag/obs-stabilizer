name: Rolling Average

on:
  pull_request:
    paths:
      - 'src/core/rolling_average.hpp'
      - 'tests/test_rolling_average.cpp'
      - '.github/workflows/rolling-average.yml'
  workflow_dispatch:

concurrency:
  group: rolling-average-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build regression test
        run: |
          mkdir -p tmp/builds/rolling-average
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Isrc tests/test_rolling_average.cpp \
            -o tmp/builds/rolling-average/test_rolling_average
      - name: Run regression test
        run: tmp/builds/rolling-average/test_rolling_average
