name: Test Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-diagnostics.yml'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test-log:
    name: Capture full unit-test log
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          platform: ubuntu

      - name: Configure tests
        run: cmake -S . -B tmp/builds/diagnostic -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build tests
        run: cmake --build tmp/builds/diagnostic --target stabilizer_tests --parallel 2

      - name: Run full test suite and capture output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/reports/test-diagnostics
          set -o pipefail
          ./tmp/builds/diagnostic/stabilizer_tests \
            --gtest_color=no \
            2>&1 | tee tmp/reports/test-diagnostics/full-test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-log-${{ github.run_number }}
          path: tmp/reports/test-diagnostics/full-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Propagate test result
        if: always()
        shell: bash
        run: exit '${{ steps.tests.outputs.exit_code }}'
